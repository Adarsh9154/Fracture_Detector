<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X-ray Fracture Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 540px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      text-align: center;
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .description {
      font-size: 1rem;
      color: #d0d0d0;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .error-message {
      color: #ff6b6b;
      margin-bottom: 20px;
    }

    input[type="file"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 14px 16px;
      width: 100%;
      font-size: 0.95rem;
      color: #fff;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background-color: #0dcaf0;
      border: none;
      padding: 8px 16px;
      margin-right: 14px;
      color: #000;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: #0bb2d4;
    }

    .btn-submit {
      margin-top: 28px;
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 8px;
      background-color: #0dcaf0;
      color: #000;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 6px 18px rgba(13, 202, 240, 0.4);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #0bb2d4;
      transform: translateY(-2px);
    }

    .footer-line {
      margin-top: 40px;
      height: 2px;
      background: linear-gradient(to right, transparent, #ffffff33, transparent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>X-ray Fracture Detection</h2>
    <p class="description">
      Upload a bone X-ray image to analyze and detect the presence of fractures using AI.
    </p>
    
    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}

    <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required />
      <button type="submit" class="btn-submit">Upload & Analyze</button>
      <div class="footer-line"></div>
    </form>
  </div>
</body>
</html>
