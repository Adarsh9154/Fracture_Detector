<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X-ray Analysis Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <a href="/download_report?prediction={{ prediction }}&accuracy={{ accuracy }}" class="btn-download">⬇️ Download PDF Report</a>

  <style>
    body {
      background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card h2 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #00d9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .image-preview img {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid #00d9ff;
    }

    .result-text {
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
    }

    .normal-result {
      color: #00ff95;
    }

    .fracture-result {
      color: #ff7676;
    }

    .accuracy {
      margin-top: 12px;
      font-size: 18px;
    }

    .timestamp {
      font-size: 15px;
      color: #cccccc;
      margin-top: 8px;
    }

    .medical-advice {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
    }

    .badge-status {
      font-size: 16px;
      padding: 5px 10px;
      border-radius: 12px;
      margin-left: 10px;
    }

    .badge-normal {
      background-color: #00ff95;
      color: #000;
    }

    .badge-fracture {
      background-color: #ff7676;
      color: #000;
    }

    .btn-back,
    .btn-download {
      margin-top: 20px;
      display: inline-block;
      background-color: #0dcaf0;
      color: #000;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-back:hover,
    .btn-download:hover {
      background-color: #0bb2d4;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>X-ray Analysis Report</h2>

  <div class="image-preview">
    <img src="{{ image_path }}" alt="X-ray Image">
  </div>

  <div class="result-text {{ 'normal-result' if prediction == 'Normal' else 'fracture-result' }}">
    {{ prediction }} Bone Structure
    <span class="badge-status {{ 'badge-normal' if prediction == 'Normal' else 'badge-fracture' }}">
      {{ prediction }}
    </span>
  </div>

  <div class="accuracy">Accuracy: {{ accuracy }}%</div>
  <div>
  <strong>Date:</strong> {{ current_date }}
</div>

 <div class="medical-advice">
  <h5>Doctor's Note:</h5>
  <p>{{ doctor_note }}</p>
</div>

  <a href="/" class="btn-back">← Analyze Another</a>
  <a href="/download_report?prediction={{ prediction }}&accuracy={{ accuracy }}" class="btn-download">⬇️ Download PDF Report</a>
</div>

</body>
</html>
